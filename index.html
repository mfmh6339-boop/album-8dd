<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Album Ảnh Đại Gia Đình 8D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #181a28;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .cover-wrap {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .book-cover {
      width: 100%;
      min-height: 460px;
      background: #c3305c;
      border-radius: 22px;
      padding: 26px 24px 26px 46px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.5);
    }

    .book-cover::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 26px;
      background: #37265c;
      border-top-left-radius: 22px;
      border-bottom-left-radius: 22px;
    }

    .cover-badge {
      width: 100%;
      background: #fff8eb;
      border: 3px solid #ffc341;
      border-radius: 16px;
      padding: 22px 14px;
      text-align: center;
      margin-top: 10px;
    }

    .cover-badge h1 {
      color: #41234b;
      font-size: clamp(24px, 5vw, 32px);
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 1.2;
    }

    .cover-badge p {
      color: #b94169;
      font-size: clamp(13px, 3vw, 15px);
      font-weight: 700;
      margin-top: 8px;
    }

    .open-btn {
      background: #ffbe2d;
      color: #411e32;
      border: none;
      border-radius: 28px;
      padding: 14px 32px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 0 #d69412;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .open-btn:hover {
      background: #ffd241;
    }

    .open-btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #d69412;
    }

    .album-box {
      display: none;
      width: min(860px, 96vw);
      background: #fffaf2;
      color: #2d2a3a;
      border: 4px solid #eb4b73;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.5);
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .back-btn {
      background: #b9323a;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .back-btn:hover {
      background: #cf3b44;
    }

    .title-box {
      flex: 1;
      background: #ffffff;
      border: 2px solid #eb4b73;
      border-radius: 12px;
      padding: 8px 14px;
      text-align: center;
      font-size: clamp(18px, 3.5vw, 24px);
      font-weight: 800;
      color: #2d2a3a;
      outline: none;
    }

    .title-box:focus {
      border-color: #c3305c;
      box-shadow: 0 0 0 3px rgba(235, 75, 115, 0.18);
    }

    .media-stage {
      background: #ffffff;
      border: 2px solid #e5dfd5;
      border-radius: 14px;
      min-height: 320px;
      max-height: 64vh;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .media-stage img,
    .media-stage video {
      max-width: 100%;
      max-height: 58vh;
      border-radius: 10px;
      object-fit: contain;
    }

    .missing-box {
      text-align: center;
      color: #5f6982;
      font-weight: 700;
      line-height: 1.5;
      padding: 16px;
    }

    .missing-box code {
      display: inline-block;
      margin-top: 6px;
      background: #f3efe8;
      color: #b9323a;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      word-break: break-all;
    }

    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }

    .nav-btn {
      background: #ffbe2d;
      color: #411e32;
      border: none;
      border-radius: 18px;
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .nav-btn:hover {
      background: #ffd241;
    }

    .page-badge {
      background: #eb4b73;
      color: #ffffff;
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }

    @media (max-width: 560px) {
      .bottom-bar {
        flex-wrap: wrap;
        justify-content: center;
      }
      .nav-btn {
        padding: 9px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

    <div class="book-cover">

        <h1>MY ALBUM</h1>

    </div>
  </section>

        type="text"
        maxlength="60"

    </div>

    <div id="mediaStage" class="media-stage"></div>

      57: { image: "1794832981559_6652188926997035746_g1291880486542543710_dc4ff74d8d2cae61a1f8921464bd61c2.jpg", title: "Hết rồi !" }
    };

    const pageNumbers = Object.keys(ALBUM_DATA).map(Number).sort((a, b) => a - b);
    const totalPages = pageNumbers.length;
    let currentIndex = 0;

    const coverScreen = document.getElementById("coverScreen");
    const albumScreen = document.getElementById("albumScreen");
    const titleInput = document.getElementById("titleInput");
    const mediaStage = document.getElementById("mediaStage");
    const pageCounter = document.getElementById("pageCounter");

    function pauseCurrentVideo() {
      const vid = mediaStage.querySelector("video");
      if (vid) vid.pause();
    }

    function buildCandidates(filename) {
      return [filename, `media/${filename}`];
    }

    function encodeRelPath(relPath) {
      return "./" + relPath.split("/").map(encodeURIComponent).join("/");
    }

    function loadMedia(pageNum, item, candidates, pos) {
      if (pos >= candidates.length) {
        mediaStage.innerHTML = `
          <div class="missing-box">
            Chưa tìm thấy file cho Trang ${pageNum}
            <code>${item.image}</code>
          </div>
        `;
        return;
      }

      const rawPath = candidates[pos];
      const url = encodeRelPath(rawPath);
      const isVideo = /\.(mp4|webm|mov|m4v)$/i.test(rawPath);

      mediaStage.innerHTML = "";

      if (isVideo) {
        const video = document.createElement("video");
        video.src = url;
        video.controls = true;
        video.playsInline = true;
        video.loop = true;
        video.onerror = () => loadMedia(pageNum, item, candidates, pos + 1);
        mediaStage.appendChild(video);
      } else {
        const img = document.createElement("img");
        img.src = url;
        img.alt = item.title;
        img.onerror = () => loadMedia(pageNum, item, candidates, pos + 1);
        mediaStage.appendChild(img);
      }
    }

    function renderPage() {
      pauseCurrentVideo();
      const pageNum = pageNumbers[currentIndex];
      const item = ALBUM_DATA[pageNum];
      titleInput.value = item.title;
      pageCounter.textContent = `Trang ${pageNum} / ${totalPages}`;
      loadMedia(pageNum, item, buildCandidates(item.image), 0);
    }

    document.getElementById("openAlbumBtn").addEventListener("click", () => {
      coverScreen.style.display = "none";
      albumScreen.style.display = "block";
      currentIndex = 0;
      renderPage();
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      pauseCurrentVideo();
      albumScreen.style.display = "none";
      coverScreen.style.display = "flex";
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      currentIndex = (currentIndex - 1 + totalPages) % totalPages;
      renderPage();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % totalPages;
      renderPage();
    });

    titleInput.addEventListener("input", (event) => {
      const pageNum = pageNumbers[currentIndex];
      ALBUM_DATA[pageNum].title = event.target.value;
    });

    document.addEventListener("keydown", (event) => {
      if (albumScreen.style.display !== "block" || document.activeElement === titleInput) {
        return;
      }
      if (event.key === "ArrowLeft") {
        currentIndex = (currentIndex - 1 + totalPages) % totalPages;
        renderPage();
      } else if (event.key === "ArrowRight") {
        currentIndex = (currentIndex + 1) % totalPages;
        renderPage();
      }
    });
  </script>
