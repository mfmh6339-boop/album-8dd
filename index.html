<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Album Ảnh Đại Gia Đình 8D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 77, 129, 0.25), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(56, 189, 248, 0.18), transparent 42%),
        #0f111a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    /* Bìa album kiểu sổ kỷ niệm có lưới ảnh nền */
    .cover-wrap {
      width: 100%;
      max-width: 450px;
      animation: fadeIn 0.3s ease;
    }

    .book-cover {
      width: 100%;
      min-height: 490px;
      background: linear-gradient(160deg, #e13b6e 0%, #9b1d49 100%);
      border-radius: 26px;
      padding: 24px 22px 26px 48px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow:
        0 24px 50px rgba(0, 0, 0, 0.65),
        0 0 0 1px rgba(255, 255, 255, 0.14) inset;
    }

    /* Lưới ảnh trang trí ở giữa bìa */
    .cover-collage {
      position: absolute;
      inset: 145px 18px 82px 44px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 8px;
      opacity: 0.42;
      pointer-events: none;
    }

    .cover-collage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.55);
      transform: rotate(-1.5deg);
    }

    .cover-collage img:nth-child(even) {
      transform: rotate(2deg);
    }

    /* Gáy sách bên trái */
    .book-cover::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 28px;
      background: linear-gradient(180deg, #3b2667 0%, #21143d 100%);
      border-right: 2px solid rgba(255, 210, 82, 0.35);
      z-index: 2;
    }

    .spine-tag {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%) rotate(-90deg);
      z-index: 3;
      color: #ffd454;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      white-space: nowrap;
      pointer-events: none;
    }

    .cover-header {
      position: relative;
      z-index: 2;
      width: 100%;
      background: rgba(255, 250, 240, 0.96);
      border: 3px solid #ffc93c;
      border-radius: 20px;
      padding: 18px 16px;
      text-align: center;
      box-shadow: 0 12px 24px rgba(25, 8, 22, 0.35);
    }

    .mini-chip {
      display: inline-block;
      background: #ffe5ec;
      color: #b82956;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .cover-header h1 {
      color: #361842;
      font-size: clamp(26px, 5.5vw, 34px);
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    .cover-header p {
      color: #b83260;
      font-size: 14px;
      font-weight: 700;
      margin-top: 6px;
    }

    .open-btn {
      position: relative;
      z-index: 2;
      background: linear-gradient(180deg, #ffe066 0%, #ffaa00 100%);
      color: #381529;
      border: none;
      border-radius: 999px;
      padding: 14px 36px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.6px;
      cursor: pointer;
      box-shadow: 0 6px 0 #b87400, 0 14px 26px rgba(0, 0, 0, 0.4);
      transition: transform 0.12s ease, filter 0.15s ease;
    }

    .open-btn:hover {
      filter: brightness(1.06);
      transform: translateY(-2px);
    }

    .open-btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #b87400;
    }

    /* Giao diện bên trong album */
    .album-box {
      display: none;
      width: min(900px, 96vw);
      background: #171a29;
      color: #f8fafc;
      border: 2px solid rgba(255, 77, 129, 0.55);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 24px 54px rgba(0, 0, 0, 0.65);
      animation: fadeIn 0.25s ease;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .back-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .back-btn:hover {
      background: #dc2626;
    }

    .title-box {
      flex: 1;
      min-width: 180px;
      background: #22273d;
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 9px 14px;
      text-align: center;
      font-size: clamp(17px, 3vw, 22px);
      font-weight: 800;
      color: #ffffff;
      outline: none;
    }

    .title-box:focus {
      border-color: #ff4d81;
      box-shadow: 0 0 0 3px rgba(255, 77, 129, 0.22);
    }

    .jump-select {
      background: #22273d;
      color: #ffd454;
      border: 1.5px solid rgba(255, 212, 84, 0.45);
      border-radius: 12px;
      padding: 9px 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      outline: none;
    }

    .media-stage {
      background: #0d0f18;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      min-height: 340px;
      max-height: 65vh;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .media-stage img,
    .media-stage video {
      max-width: 100%;
      max-height: 59vh;
      border-radius: 12px;
      object-fit: contain;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .missing-box {
      text-align: center;
      color: #94a3b8;
      font-weight: 700;
      line-height: 1.6;
      padding: 16px;
    }

    .missing-box code {
      display: inline-block;
      margin-top: 8px;
      background: #1e2438;
      color: #fda4af;
      border: 1px solid rgba(251, 113, 133, 0.3);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      word-break: break-all;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: #252b42;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 14px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff4d81 0%, #ffbe2d 100%);
      transition: width 0.25s ease;
    }

    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: linear-gradient(180deg, #ffd454 0%, #ffaa00 100%);
      color: #2b1422;
      border: none;
      border-radius: 999px;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .nav-btn:hover {
      filter: brightness(1.06);
    }

    .page-badge {
      background: linear-gradient(135deg, #ff4d81 0%, #c82356 100%);
      color: #fff;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 800;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

    };

    const pageNumbers = Object.keys(ALBUM_DATA).map(Number).sort((a, b) => a - b);
    const totalPages = pageNumbers.length;
    let currentIndex = 0;

    const coverScreen = document.getElementById("coverScreen");
    const albumScreen = document.getElementById("albumScreen");
    const coverCollage = document.getElementById("coverCollage");
    const titleInput = document.getElementById("titleInput");
    const jumpSelect = document.getElementById("jumpSelect");
    const mediaStage = document.getElementById("mediaStage");
    const pageCounter = document.getElementById("pageCounter");
    const progressFill = document.getElementById("progressFill");

    function encodeRelPath(relPath) {
      return "./" + relPath.split("/").map(encodeURIComponent).join("/");
    }

    function initCoverCollage() {
      const sampleImages = pageNumbers
        .map((n) => ALBUM_DATA[n].image)
        .filter((f) => /\.(jpg|jpeg|png|webp)$/i.test(f))
        .slice(0, 6);

      coverCollage.innerHTML = "";
      sampleImages.forEach((file) => {
        const img = document.createElement("img");
        img.src = encodeRelPath(file);
        img.alt = "";
        img.onerror = () => img.remove();
        coverCollage.appendChild(img);
      });
    }

    function initJumpSelect() {
      jumpSelect.innerHTML = "";
      pageNumbers.forEach((n, i) => {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `Trang ${n}`;
        jumpSelect.appendChild(opt);
      });
    }

    function pauseCurrentVideo() {
      const vid = mediaStage.querySelector("video");
      if (vid) vid.pause();
    }

    function loadMedia(pageNum, item, candidates, pos) {
      if (pos >= candidates.length) {
        mediaStage.innerHTML = `
          <div class="missing-box">
            Chưa tìm thấy file cho Trang ${pageNum}
            <code>${item.image}</code>
          </div>
        `;
        return;
      }

      const rawPath = candidates[pos];
      const url = encodeRelPath(rawPath);
      const isVideo = /\.(mp4|webm|mov|m4v)$/i.test(rawPath);

      mediaStage.innerHTML = "";
      if (isVideo) {
        const video = document.createElement("video");
        video.src = url;
        video.controls = true;
        video.playsInline = true;
        video.loop = true;
        video.onerror = () => loadMedia(pageNum, item, candidates, pos + 1);
        mediaStage.appendChild(video);
      } else {
        const img = document.createElement("img");
        img.src = url;
        img.alt = item.title;
        img.onerror = () => loadMedia(pageNum, item, candidates, pos + 1);
        mediaStage.appendChild(img);
      }
    }

    function renderPage() {
      pauseCurrentVideo();
      const pageNum = pageNumbers[currentIndex];
      const item = ALBUM_DATA[pageNum];
      titleInput.value = item.title;
      jumpSelect.value = currentIndex;
      pageCounter.textContent = `Trang ${pageNum} / ${totalPages}`;
      progressFill.style.width = `${(pageNum / totalPages) * 100}%`;
      loadMedia(pageNum, item, [item.image, `media/${item.image}`], 0);
    }

    document.getElementById("openAlbumBtn").addEventListener("click", () => {
      coverScreen.style.display = "none";
      albumScreen.style.display = "block";
      currentIndex = 0;
      renderPage();
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      pauseCurrentVideo();
      albumScreen.style.display = "none";
      coverScreen.style.display = "block";
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      currentIndex = (currentIndex - 1 + totalPages) % totalPages;
      renderPage();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % totalPages;
      renderPage();
    });

    jumpSelect.addEventListener("change", (e) => {
      currentIndex = Number(e.target.value);
      renderPage();
    });

    titleInput.addEventListener("input", (e) => {
      const pageNum = pageNumbers[currentIndex];
      ALBUM_DATA[pageNum].title = e.target.value;
    });

    document.addEventListener("keydown", (e) => {
      if (albumScreen.style.display !== "block" || document.activeElement === titleInput) return;
      if (e.key === "ArrowLeft") {
        currentIndex = (currentIndex - 1 + totalPages) % totalPages;
        renderPage();
      } else if (e.key === "ArrowRight") {
        currentIndex = (currentIndex + 1) % totalPages;
        renderPage();
      }
    });

    initCoverCollage();
    initJumpSelect();
  </script>
</body>
</html>
