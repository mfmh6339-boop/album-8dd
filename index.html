<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Album Ảnh Đại Gia Đình 8D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #161926;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    /* Trang bìa phong cách sổ tay có đường khâu viền */
    .cover-wrap {
      width: 100%;
      max-width: 430px;
      animation: fadeIn 0.25s ease;
    }

    .book-cover {
      width: 100%;
      min-height: 470px;
      background: #c8325d;
      background-image: radial-gradient(rgba(255, 248, 235, 0.14) 1.2px, transparent 1.2px);
      background-size: 16px 16px;
      border-radius: 22px;
      padding: 24px 22px 26px 46px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.55);
    }

    .book-cover::after {
      content: "";
      position: absolute;
      inset: 10px 10px 10px 36px;
      border: 2px dashed rgba(255, 236, 179, 0.55);
      border-radius: 16px;
      pointer-events: none;
    }

    .book-cover::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 26px;
      background: #352359;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 34px,
        rgba(255, 212, 84, 0.45) 34px,
        rgba(255, 212, 84, 0.45) 38px
      );
      border-top-left-radius: 22px;
      border-bottom-left-radius: 22px;
      z-index: 2;
    }

    .cover-badge {
      position: relative;
      z-index: 2;
      width: 100%;
      background: #fffaf0;
      border: 3px solid #ffc63b;
      border-radius: 18px;
      padding: 22px 16px;
      text-align: center;
      margin-top: 8px;
      box-shadow: 0 6px 0 rgba(75, 20, 42, 0.25);
    }

    .cover-badge::before {
      content: "8D";
      position: absolute;
      top: -11px;
      right: 14px;
      background: #ffbe2d;
      color: #3d1a2e;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 9px;
      border-radius: 999px;
      border: 2px solid #fffaf0;
    }

    .cover-badge h1 {
      color: #3c1d47;
      font-size: clamp(26px, 5.2vw, 32px);
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    .cover-badge p {
      color: #b63862;
      font-size: 14px;
      font-weight: 700;
      margin-top: 8px;
    }

    .cover-deco {
      position: relative;
      z-index: 2;
      width: 100%;
      background: rgba(255, 250, 240, 0.14);
      border: 1.5px dashed rgba(255, 248, 235, 0.55);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      color: #fff6e5;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
    }

    .open-btn {
      position: relative;
      z-index: 2;
      background: #ffbe2d;
      color: #3d1a2e;
      border: none;
      border-radius: 999px;
      padding: 13px 32px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #c7860a;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .open-btn:hover {
      background: #ffd147;
    }

    .open-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #c7860a;
    }

    /* Giao diện xem album bên trong */
    .album-box {
      display: none;
      width: min(900px, 96vw);
      background-color: #fffaf2;
      background-image: radial-gradient(rgba(235, 75, 115, 0.1) 1.1px, transparent 1.1px);
      background-size: 20px 20px;
      color: #2d2a3a;
      border: 4px solid var(--page-accent, #eb4b73);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      animation: fadeIn 0.25s ease;
      transition: border-color 0.25s ease;
    }

    /* Dải hoa văn dệt / thổ cẩm chạy ngang đầu khung trang */
    .page-motif-banner {
      height: 22px;
      border-radius: 10px;
      margin-bottom: 12px;
      background-color: var(--motif-bg, #ffe9ef);
      border: 1.5px solid var(--motif-border, #f3b5c6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      overflow: hidden;
    }

    .page-motif-banner svg {
      width: 100%;
      height: 16px;
      display: block;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .back-btn {
      background: #b9323a;
      color: #ffffff;
      border: none;
      border-radius: 11px;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 0 #821d23;
    }

    .back-btn:hover {
      background: #cc3a43;
    }

    .back-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #821d23;
    }

    .title-box {
      flex: 1;
      min-width: 180px;
      background: #ffffff;
      border: 2px solid var(--page-accent, #eb4b73);
      border-radius: 12px;
      padding: 8px 14px;
      text-align: center;
      font-size: clamp(18px, 3.2vw, 23px);
      font-weight: 800;
      color: #2d2a3a;
      outline: none;
    }

    .title-box:focus {
      box-shadow: 0 0 0 3px rgba(235, 75, 115, 0.16);
    }

    .jump-select {
      background: #ffffff;
      color: #3d1a2e;
      border: 2px solid #ffc341;
      border-radius: 12px;
      padding: 9px 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      outline: none;
    }

    /* Trang sách có họa tiết hoa lá, nét trang sách & hoa văn dân tộc ở 4 góc */
    .media-stage {
      background: #ffffff;
      border: 2px solid #e6ddd0;
      border-radius: 16px;
      min-height: 340px;
      max-height: 64vh;
      padding: 28px 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .page-ornament {
      position: absolute;
      pointer-events: none;
      z-index: 2;
      opacity: 0.9;
    }

    .orn-tl { top: 6px; left: 6px; width: 78px; height: 78px; }
    .orn-tr { top: 6px; right: 6px; width: 78px; height: 78px; transform: scaleX(-1); }
    .orn-bl { bottom: 6px; left: 6px; width: 78px; height: 78px; transform: scaleY(-1); }
    .orn-br { bottom: 6px; right: 6px; width: 78px; height: 78px; transform: scale(-1, -1); }

    .media-stage img,
    .media-stage video {
      position: relative;
      z-index: 3;
      max-width: 100%;
      max-height: 55vh;
      border-radius: 10px;
      object-fit: contain;
      background: #ffffff;
    }

    .missing-box {
      position: relative;
      z-index: 3;
      text-align: center;
      color: #5f6982;
      font-weight: 700;
      line-height: 1.55;
      padding: 16px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 12px;
    }

    .missing-box code {
      display: inline-block;
      margin-top: 8px;
      background: #fff3f6;
      border: 1px solid #f5c2d0;
      color: #b9323a;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      word-break: break-all;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: #efe3d5;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 14px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--page-accent, #eb4b73);
      border-radius: 999px;
      transition: width 0.2s ease, background-color 0.25s ease;
    }

    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: #ffbe2d;
      color: #3d1a2e;
      border: none;
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 0 #c7860a;
    }

    .nav-btn:hover {
      background: #ffd147;
    }

    .nav-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #c7860a;
    }

    .page-badge {
      background: var(--page-accent, #eb4b73);
      color: #ffffff;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 800;
      transition: background-color 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .media-stage {
        padding: 20px 18px;
      }
      .orn-tl, .orn-tr, .orn-bl, .orn-br {
        width: 54px;
        height: 54px;
      }
    }
  </style>
</head>

    function buildBannerSVG(styleIndex, theme) {
      const mode = styleIndex % 4;
      if (mode === 0) {

        return `

            <g fill="none" stroke="${theme.c1}" stroke-width="1.6">

      if (mode === 1) {
        // Dây leo lá & nụ hoa

            <path d="M0 14 A12 12 0 0 1 24 14 A12 12 0 0 1 48 14 A12 12 0 0 1 72 14 A12 12 0 0 1 96 14
                     A12 12 0 0 1 120 14 A12 12 0 0 1 144 14 A12 12 0 0 1 168 14 A12 12 0 0 1 192 14
                     A12 12 0 0 1 216 14 A12 12 0 0 1 240 14 A12 12 0 0 1 264 14 A12 12 0 0 1 288 14
                     A12 12 0 0 1 312 14 A12 12 0 0 1 336 14 A12 12 0 0 1 360 14 A12 12 0 0 1 384 14
                     A12 12 0 0 1 408 14 A12 12 0 0 1 432 14 A12 12 0 0 1 456 14 A12 12 0 0 1 480 14
                     A12 12 0 0 1 504 14 A12 12 0 0 1 528 14 A12 12 0 0 1 552 14 A12 12 0 0 1 576 14"
                  fill="none" stroke="${theme.c1}" stroke-width="1.5"/>
            <g fill="${theme.c3}">
              <polygon points="12,5 15,9 12,13 9,9"/><polygon points="60,5 63,9 60,13 57,9"/>
              <polygon points="108,5 111,9 108,13 105,9"/><polygon points="156,5 159,9 156,13 153,9"/>
              <polygon points="204,5 207,9 204,13 201,9"/><polygon points="252,5 255,9 252,13 249,9"/>
              <polygon points="300,5 303,9 300,13 297,9"/><polygon points="348,5 351,9 348,13 345,9"/>
              <polygon points="396,5 399,9 396,13 393,9"/><polygon points="444,5 447,9 444,13 441,9"/>
              <polygon points="492,5 495,9 492,13 489,9"/><polygon points="540,5 543,9 540,13 537,9"/>
            </g>
          </svg>
        `;
      }
      // Răng cưa thổ cẩm xen kẽ hoa văn

            <polygon points="188,16 198,3 208,16"/><polygon points="218,16 228,3 238,16"/>
            <polygon points="248,16 258,3 268,16"/><polygon points="278,16 288,3 298,16"/>
            <polygon points="308,16 318,3 328,16"/><polygon points="338,16 348,3 358,16"/>

            <polygon points="428,16 438,3 448,16"/><polygon points="458,16 468,3 478,16"/>

            <polygon points="548,16 558,3 568,16"/><polygon points="578,16 588,3 598,16"/>
          </g>
          <circle cx="33" cy="9" r="2.2" fill="${theme.c2}"/>
          <circle cx="93" cy="9" r="2.2" fill="${theme.c2}"/>
          <circle cx="153" cy="9" r="2.2" fill="${theme.c2}"/>
          <circle cx="213" cy="9" r="2.2" fill="${theme.c2}"/>
          <circle cx="273" cy="9" r="2.2" fill="${theme.c2}"/>
          <circle cx="333" cy="9" r="2.2" fill="${theme.c2}"/>
          <circle cx="393" cy="9" r="2.2" fill="${theme.c2}"/>
          <circle cx="453" cy="9" r="2.2" fill="${theme.c2}"/>
          <circle cx="513" cy="9" r="2.2" fill="${theme.c2}"/>
          <circle cx="573" cy="9" r="2.2" fill="${theme.c2}"/>
        </svg>
      `;
    }

    // Họa tiết góc trang sách: hoa 6 cánh + nhánh lá + khung trang sách + nét dân tộc
    function buildCornerSVG(cornerKind, theme) {
      const k = cornerKind % 4;
      if (k === 0) {
        // Hoa cánh tròn + nhánh lá + nét khung trang sách
        return `
          <svg viewBox="0 0 90 90">
            <path d="M6 76 L6 6 L76 6" fill="none" stroke="${theme.c1}" stroke-width="2" stroke-linecap="round"/>
            <path d="M12 68 L12 12 L68 12" fill="none" stroke="${theme.c3}" stroke-width="1.2" stroke-dasharray="3 3"/>
            <path d="M14 48 Q24 24 52 14" fill="none" stroke="${theme.c2}" stroke-width="2" stroke-linecap="round"/>
            <ellipse cx="26" cy="30" rx="7" ry="3.5" transform="rotate(-38 26 30)" fill="${theme.c2}"/>
            <ellipse cx="38" cy="21" rx="7" ry="3.5" transform="rotate(-22 38 21)" fill="${theme.c2}"/>
            <g transform="translate(18,18)">
              <circle cx="0" cy="-7" r="4.5" fill="${theme.c1}"/>
              <circle cx="6.6" cy="-2.2" r="4.5" fill="${theme.c1}"/>
              <circle cx="4.1" cy="5.7" r="4.5" fill="${theme.c1}"/>
              <circle cx="-4.1" cy="5.7" r="4.5" fill="${theme.c1}"/>
              <circle cx="-6.6" cy="-2.2" r="4.5" fill="${theme.c1}"/>
              <circle cx="0" cy="0" r="3.4" fill="${theme.c3}"/>
            </g>
          </svg>
        `;
      }
      if (k === 1) {
        // Hoa văn dân tộc (hình thoi & tam giác dệt) + lá nhỏ
        return `
          <svg viewBox="0 0 90 90">
            <path d="M6 78 L6 6 L78 6" fill="none" stroke="${theme.c1}" stroke-width="2.2"/>
            <polygon points="18,6 26,14 18,22 10,14" fill="none" stroke="${theme.c1}" stroke-width="1.7"/>
            <circle cx="18" cy="14" r="2.3" fill="${theme.c3}"/>
            <polygon points="34,6 42,13 26,13" fill="${theme.c2}" opacity="0.85"/>
            <polygon points="6,34 13,42 13,26" fill="${theme.c2}" opacity="0.85"/>
            <path d="M14 54 Q26 36 50 18" fill="none" stroke="${theme.c2}" stroke-width="1.6"/>
            <circle cx="48" cy="18" r="3" fill="${theme.c1}"/>
          </svg>
        `;
      }
      if (k === 2) {
        // Cuộn trang sách cổ điển + bông hoa cánh nhọn
        return `
          <svg viewBox="0 0 90 90">
            <path d="M8 74 C8 22, 22 8, 74 8" fill="none" stroke="${theme.c1}" stroke-width="2" stroke-linecap="round"/>
            <path d="M14 64 C14 26, 26 14, 64 14" fill="none" stroke="${theme.c2}" stroke-width="1.5" stroke-linecap="round"/>
            <g transform="translate(20,20)">
              <polygon points="0,-10 3.2,-3.2 10,0 3.2,3.2 0,10 -3.2,3.2 -10,0 -3.2,-3.2" fill="${theme.c1}"/>
              <circle cx="0" cy="0" r="3" fill="${theme.c3}"/>
            </g>
            <ellipse cx="44" cy="14" rx="6" ry="2.8" fill="${theme.c2}"/>
            <ellipse cx="14" cy="44" rx="2.8" ry="6" fill="${theme.c2}"/>
          </svg>
        `;
      }
      // Hoa văn dệt bậc thang dân tộc + chùm lá
      return `
        <svg viewBox="0 0 90 90">
          <path d="M6 76 L6 6 L76 6" fill="none" stroke="${theme.c1}" stroke-width="2"/>
          <path d="M12 44 L12 24 L24 24 L24 12 L44 12" fill="none" stroke="${theme.c3}" stroke-width="1.8"/>
          <g transform="translate(17,17)">
            <circle cx="-5" cy="-5" r="4" fill="${theme.c2}"/>
            <circle cx="5" cy="-5" r="4" fill="${theme.c2}"/>
            <circle cx="5" cy="5" r="4" fill="${theme.c2}"/>
            <circle cx="-5" cy="5" r="4" fill="${theme.c2}"/>
            <circle cx="0" cy="0" r="3" fill="${theme.c1}"/>
          </g>
          <path d="M28 28 L46 46" stroke="${theme.c2}" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="47" cy="47" r="2.8" fill="${theme.c3}"/>
        </svg>
      `;
    }

    const pageNumbers = Object.keys(ALBUM_DATA).map(Number).sort((a, b) => a - b);
    const totalPages = pageNumbers.length;
    let currentIndex = 0;

    const coverScreen = document.getElementById("coverScreen");
    const albumScreen = document.getElementById("albumScreen");
    const motifBanner = document.getElementById("motifBanner");
    const titleInput = document.getElementById("titleInput");
    const jumpSelect = document.getElementById("jumpSelect");
    const mediaStage = document.getElementById("mediaStage");
    const pageCounter = document.getElementById("pageCounter");
    const progressFill = document.getElementById("progressFill");

    function encodeRelPath(relPath) {
      return "./" + relPath.split("/").map(encodeURIComponent).join("/");
    }

    function applyPageDecoration(pageNum) {
      const theme = THEMES[(pageNum - 1) % THEMES.length];
      albumScreen.style.setProperty("--page-accent", theme.accent);
      motifBanner.style.backgroundColor = theme.bannerBg;
      motifBanner.style.borderColor = theme.bannerBorder;
      motifBanner.innerHTML = buildBannerSVG(pageNum - 1, theme);
      return theme;
    }

    function renderCornerOrnaments(pageNum, theme) {
      const corners = [
        { cls: "orn-tl", kind: pageNum - 1 },
        { cls: "orn-tr", kind: pageNum },
        { cls: "orn-bl", kind: pageNum + 1 },
        { cls: "orn-br", kind: pageNum + 2 }
      ];

      corners.forEach(({ cls, kind }) => {
        const div = document.createElement("div");
        div.className = `page-ornament ${cls}`;
        div.innerHTML = buildCornerSVG(kind, theme);
        mediaStage.appendChild(div);
      });
    }

    function initJumpSelect() {
      jumpSelect.innerHTML = "";
      pageNumbers.forEach((n, i) => {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `Trang ${n}`;
        jumpSelect.appendChild(opt);
      });
    }

    function pauseCurrentVideo() {
      const vid = mediaStage.querySelector("video");
      if (vid) vid.pause();
    }

    function loadMedia(pageNum, item, candidates, pos, theme) {
      if (pos >= candidates.length) {
        mediaStage.innerHTML = `
          <div class="missing-box">
            Chưa tìm thấy file cho Trang ${pageNum}
            <code>${item.image}</code>
          </div>
        `;
        renderCornerOrnaments(pageNum, theme);
        return;
      }

      const rawPath = candidates[pos];
      const url = encodeRelPath(rawPath);
      const isVideo = /\.(mp4|webm|mov|m4v)$/i.test(rawPath);

      mediaStage.innerHTML = "";
      if (isVideo) {
        const video = document.createElement("video");
        video.src = url;
        video.controls = true;
        video.playsInline = true;
        video.loop = true;
        video.onerror = () => loadMedia(pageNum, item, candidates, pos + 1, theme);
        mediaStage.appendChild(video);
      } else {
        const img = document.createElement("img");
        img.src = url;
        img.alt = item.title;
        img.onerror = () => loadMedia(pageNum, item, candidates, pos + 1, theme);
        mediaStage.appendChild(img);
      }
      renderCornerOrnaments(pageNum, theme);
    }

    function renderPage() {
      pauseCurrentVideo();
      const pageNum = pageNumbers[currentIndex];
      const item = ALBUM_DATA[pageNum];
      const theme = applyPageDecoration(pageNum);
      titleInput.value = item.title;
      jumpSelect.value = currentIndex;
      pageCounter.textContent = `Trang ${pageNum} / ${totalPages}`;
      progressFill.style.width = `${(pageNum / totalPages) * 100}%`;
      loadMedia(pageNum, item, [item.image, `media/${item.image}`], 0, theme);
    }

    function goPrev() {
      currentIndex = (currentIndex - 1 + totalPages) % totalPages;
      renderPage();
    }

    function goNext() {
      currentIndex = (currentIndex + 1) % totalPages;
      renderPage();
    }

    document.getElementById("openAlbumBtn").addEventListener("click", () => {
      coverScreen.style.display = "none";
      albumScreen.style.display = "block";
      currentIndex = 0;
      renderPage();
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      pauseCurrentVideo();
      albumScreen.style.display = "none";
      coverScreen.style.display = "block";
    });

    document.getElementById("prevBtn").addEventListener("click", goPrev);
    document.getElementById("nextBtn").addEventListener("click", goNext);

    jumpSelect.addEventListener("change", (e) => {
      currentIndex = Number(e.target.value);
      renderPage();
    });

    titleInput.addEventListener("input", (e) => {
      const pageNum = pageNumbers[currentIndex];
      ALBUM_DATA[pageNum].title = e.target.value;
    });

    document.addEventListener("keydown", (e) => {
      if (albumScreen.style.display !== "block" || document.activeElement === titleInput) return;
      if (e.key === "ArrowLeft") {
        goPrev();
      } else if (e.key === "ArrowRight") {
        goNext();
      }
    });

    let touchStartX = 0;
    mediaStage.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
      }
    }, { passive: true });

    mediaStage.addEventListener("touchend", (e) => {
      if (e.changedTouches.length === 1) {
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 55) {
          if (dx < 0) goNext();
          else goPrev();
        }
      }
    }, { passive: true });

    initJumpSelect();
  </script>
