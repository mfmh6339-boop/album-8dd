<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Album Ảnh Đại Gia Đình 8D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #131524;
      background-image:
        radial-gradient(circle at 18% 20%, rgba(255, 77, 148, 0.22), transparent 36%),
        radial-gradient(circle at 82% 78%, rgba(255, 212, 71, 0.18), transparent 38%),
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px, 24px 24px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    /* Trang bìa phong cách sổ tay có đường khâu viền */
    .cover-wrap {
      width: 100%;
      max-width: 430px;
      animation: fadeIn 0.25s ease;
    }

    .book-cover {
      width: 100%;
      min-height: 470px;
      background: #c8325d;
      background-image: radial-gradient(rgba(255, 248, 235, 0.16) 1.2px, transparent 1.2px);
      background-size: 16px 16px;
      border-radius: 22px;
      padding: 24px 22px 26px 46px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.6);
    }

    .book-cover::after {
      content: "";
      position: absolute;
      inset: 10px 10px 10px 36px;
      border: 2px dashed rgba(255, 236, 179, 0.65);
      border-radius: 16px;
      pointer-events: none;
    }

    .book-cover::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 26px;
      background: #352359;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 34px,
        rgba(255, 212, 84, 0.5) 34px,
        rgba(255, 212, 84, 0.5) 38px
      );
      border-top-left-radius: 22px;
      border-bottom-left-radius: 22px;
      z-index: 2;
    }

    .cover-badge {
      position: relative;
      z-index: 2;
      width: 100%;
      background: #fffaf0;
      border: 3px solid #ffc63b;
      border-radius: 18px;
      padding: 22px 16px;
      text-align: center;
      margin-top: 8px;
      box-shadow: 0 6px 0 rgba(75, 20, 42, 0.25);
    }

    .cover-badge::before {
      content: "✦ 8D ✦";
      position: absolute;
      top: -12px;
      right: 14px;
      background: linear-gradient(135deg, #ffe57f, #ffae19);
      color: #3d1a2e;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 10px;
      border-radius: 999px;
      border: 2px solid #fffaf0;
    }

    .cover-badge h1 {
      color: #3c1d47;
      font-size: clamp(26px, 5.2vw, 32px);
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    .cover-badge p {
      color: #b63862;
      font-size: 14px;
      font-weight: 700;
      margin-top: 8px;
    }

    .cover-deco {
      position: relative;
      z-index: 2;
      width: 100%;
      background: rgba(255, 250, 240, 0.16);
      border: 1.5px dashed rgba(255, 248, 235, 0.65);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      color: #fff6e5;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
    }

    .open-btn {
      position: relative;
      z-index: 2;
      background: linear-gradient(180deg, #ffe26a 0%, #ffae19 100%);
      color: #3d1a2e;
      border: none;
      border-radius: 999px;
      padding: 13px 32px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #c7860a, 0 0 22px rgba(255, 212, 84, 0.45);
      transition: transform 0.12s ease, filter 0.15s ease;
    }

    .open-btn:hover {
      filter: brightness(1.06);
    }

    .open-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #c7860a;
    }

    /* Giao diện xem album bên trong */
    .album-box {
      display: none;
      width: min(920px, 96vw);
      background-color: #fffaf2;
      background-image:
        radial-gradient(rgba(255, 195, 65, 0.22) 1.4px, transparent 1.4px),
        radial-gradient(rgba(235, 75, 115, 0.12) 1.2px, transparent 1.2px);
      background-size: 22px 22px, 34px 34px;
      background-position: 0 0, 11px 11px;
      color: #2d2a3a;
      border: 4px solid var(--page-accent, #eb4b73);
      border-radius: 24px;
      padding: 18px;
      box-shadow:
        0 20px 46px rgba(0, 0, 0, 0.62),
        0 0 28px var(--page-glow, rgba(255, 190, 45, 0.28));
      animation: fadeIn 0.25s ease;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    /* Dải hoa văn dệt / dân tộc & nhũ lấp lánh đầu trang */
    .page-motif-banner {
      height: 26px;
      border-radius: 12px;
      margin-bottom: 12px;
      background-color: var(--motif-bg, #fff0f5);
      border: 2px solid var(--motif-border, #ffc43d);
      display: flex;
      align-items: center;
      padding: 0 8px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.8);
    }

    .page-motif-banner svg {
      width: 100%;
      height: 20px;
      display: block;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .back-btn {
      background: #b9323a;
      color: #ffffff;
      border: none;
      border-radius: 11px;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 0 #821d23;
    }

    .back-btn:hover {
      background: #cc3a43;
    }

    .back-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #821d23;
    }

    .title-box {
      flex: 1;
      min-width: 180px;
      background: linear-gradient(180deg, #ffffff 0%, #fffdf8 100%);
      border: 2px solid var(--page-accent, #eb4b73);
      border-radius: 12px;
      padding: 8px 14px;
      text-align: center;
      font-size: clamp(18px, 3.2vw, 23px);
      font-weight: 800;
      color: #2d2a3a;
      outline: none;
      box-shadow: 0 3px 10px rgba(255, 195, 65, 0.18);
    }

    .title-box:focus {
      box-shadow: 0 0 0 3px rgba(235, 75, 115, 0.2);
    }

    .jump-select {
      background: linear-gradient(180deg, #fffdf7 0%, #fff3d1 100%);
      color: #3d1a2e;
      border: 2px solid #ffc341;
      border-radius: 12px;
      padding: 9px 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      outline: none;
    }

    /* Khung trang sách bling bling với hoa nổi, món đồ sticker & ánh sáng lấp lánh */
    .media-stage {
      background:
        linear-gradient(135deg, rgba(255, 248, 225, 0.65) 0%, rgba(255, 255, 255, 0.96) 50%, rgba(255, 240, 248, 0.72) 100%);
      border: 2.5px solid #ffd15c;
      border-radius: 18px;
      min-height: 350px;
      max-height: 65vh;
      padding: 34px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      box-shadow:
        inset 0 0 0 4px rgba(255, 255, 255, 0.9),
        inset 0 0 24px var(--page-glow, rgba(255, 195, 65, 0.22));
    }

    /* Vệt sáng bling chạy ngang nhẹ nhàng */
    .media-stage::after {
      content: "";
      position: absolute;
      top: -40%;
      left: -65%;
      width: 42%;
      height: 180%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.55),
        rgba(255, 232, 133, 0.45),
        transparent
      );
      transform: rotate(22deg);
      animation: blingSweep 4.5s ease-in-out infinite;
      pointer-events: none;
      z-index: 4;
    }

    .bling-sticker {
      position: absolute;
      pointer-events: none;
      z-index: 5;
      filter: drop-shadow(0 4px 8px rgba(45, 25, 65, 0.22)) drop-shadow(0 0 6px rgba(255, 224, 102, 0.75));
      animation: sparkleFloat 2.8s ease-in-out infinite;
    }

    .sticker-tl { top: 8px; left: 10px; width: 68px; height: 68px; animation-delay: 0s; }
    .sticker-tr { top: 8px; right: 10px; width: 68px; height: 68px; animation-delay: 0.7s; }
    .sticker-bl { bottom: 8px; left: 10px; width: 64px; height: 64px; animation-delay: 1.4s; }
    .sticker-br { bottom: 8px; right: 10px; width: 64px; height: 64px; animation-delay: 2.1s; }

    .sparkle-gem {
      position: absolute;
      pointer-events: none;
      z-index: 5;
      animation: twinkleStar 1.8s ease-in-out infinite;
    }

    .gem-1 { top: 14px; left: 86px; width: 22px; height: 22px; animation-delay: 0.1s; }
    .gem-2 { top: 16px; right: 86px; width: 20px; height: 20px; animation-delay: 0.6s; }
    .gem-3 { bottom: 14px; left: 84px; width: 20px; height: 20px; animation-delay: 1.1s; }
    .gem-4 { bottom: 16px; right: 84px; width: 22px; height: 22px; animation-delay: 1.5s; }

    .media-stage img,
    .media-stage video {
      position: relative;
      z-index: 3;
      max-width: 100%;
      max-height: 54vh;
      border-radius: 12px;
      object-fit: contain;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(24, 26, 40, 0.14);
    }

    .missing-box {
      position: relative;
      z-index: 3;
      text-align: center;
      color: #5f6982;
      font-weight: 700;
      line-height: 1.55;
      padding: 16px;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 12px;
    }

    .missing-box code {
      display: inline-block;
      margin-top: 8px;
      background: #fff3f6;
      border: 1px solid #f5c2d0;
      color: #b9323a;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      word-break: break-all;
    }

    .progress-track {
      width: 100%;
      height: 7px;
      background: #efe3d5;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 14px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--page-accent, #eb4b73), #ffbe2d, #fff099);
      border-radius: 999px;
      transition: width 0.2s ease;
    }

    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: linear-gradient(180deg, #ffe26a 0%, #ffbe2d 100%);
      color: #3d1a2e;
      border: none;
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 0 #c7860a;
    }

    .nav-btn:hover {
      filter: brightness(1.05);
    }

    .nav-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #c7860a;
    }

    .page-badge {
      background: var(--page-accent, #eb4b73);
      color: #ffffff;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 0 14px var(--page-glow, rgba(235, 75, 115, 0.35));
      transition: background-color 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes blingSweep {
      0% { left: -65%; opacity: 0; }
      25% { opacity: 1; }
      65% { left: 125%; opacity: 0.9; }
      100% { left: 125%; opacity: 0; }
    }

    @keyframes sparkleFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-3px) scale(1.04); }
    }

    @keyframes twinkleStar {
      0%, 100% { transform: scale(0.75) rotate(0deg); opacity: 0.55; }
      50% { transform: scale(1.18) rotate(20deg); opacity: 1; }
    }

    @media (max-width: 600px) {
      .media-stage {
        padding: 26px 18px;
      }
      .sticker-tl, .sticker-tr, .sticker-bl, .sticker-br {
        width: 48px;
        height: 48px;
      }
      .gem-1, .gem-2, .gem-3, .gem-4 {
        display: none;
      }
    }
  </style>
</head>

      78: { image: "d83358fdf7db4f1d8ec3a7692e56f7c2.webp", title: "Sao lại ngon thế được nhở!" }
    };

    const THEMES = [
      { accent: "#ff3d7f", glow: "rgba(255, 61, 127, 0.35)", bg: "#fff0f6", border: "#ff85b3", main: "#e01e5a", gold: "#ffbe18", leaf: "#249e6b" },
      { accent: "#8b5cf6", glow: "rgba(139, 92, 246, 0.35)", bg: "#f5f0ff", border: "#b794f4", main: "#6d28d9", gold: "#fbbf24", leaf: "#10b981" },
      { accent: "#f59e0b", glow: "rgba(245, 158, 11, 0.38)", bg: "#fffbeb", border: "#fcd34d", main: "#d97706", gold: "#f43f5e", leaf: "#15803d" },
      { accent: "#ec4899", glow: "rgba(236, 72, 153, 0.35)", bg: "#fdf2f8", border: "#f9a8d4", main: "#db2777", gold: "#facc15", leaf: "#0d9488" },
      { accent: "#0ea5e9", glow: "rgba(14, 165, 233, 0.34)", bg: "#f0f9ff", border: "#7dd3fc", main: "#0284c7", gold: "#fbbf24", leaf: "#e11d48" }
    ];

    function buildBannerSVG(pageNum, t) {
      return `
        <svg viewBox="0 0 720 22" preserveAspectRatio="none">
          <defs>
            <linearGradient id="blingGrad${pageNum}" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="${t.gold}"/>
              <stop offset="50%" stop-color="${t.main}"/>
              <stop offset="100%" stop-color="${t.gold}"/>
            </linearGradient>
          </defs>
          <path d="M0 11 L20 2 L40 11 L20 20 L0 11 Z
                   M40 11 L60 2 L80 11 L60 20 L40 11 Z
                   M80 11 L100 2 L120 11 L100 20 L80 11 Z
                   M120 11 L140 2 L160 11 L140 20 L120 11 Z
                   M160 11 L180 2 L200 11 L180 20 L160 11 Z
                   M200 11 L220 2 L240 11 L220 20 L200 11 Z
                   M240 11 L260 2 L280 11 L260 20 L240 11 Z
                   M280 11 L300 2 L320 11 L300 20 L280 11 Z
                   M320 11 L340 2 L360 11 L340 20 L320 11 Z
                   M360 11 L380 2 L400 11 L380 20 L360 11 Z
                   M400 11 L420 2 L440 11 L420 20 L400 11 Z
                   M440 11 L460 2 L480 11 L460 20 L440 11 Z
                   M480 11 L500 2 L520 11 L500 20 L480 11 Z
                   M520 11 L540 2 L560 11 L540 20 L520 11 Z
                   M560 11 L580 2 L600 11 L580 20 L560 11 Z
                   M600 11 L620 2 L640 11 L620 20 L600 11 Z
                   M640 11 L660 2 L680 11 L660 20 L640 11 Z
                   M680 11 L700 2 L720 11 L700 20 L680 11 Z"
                fill="none" stroke="url(#blingGrad${pageNum})" stroke-width="1.8"/>
          <circle cx="20" cy="11" r="3" fill="${t.gold}"/>
          <circle cx="100" cy="11" r="3" fill="${t.main}"/>
          <circle cx="180" cy="11" r="3" fill="${t.gold}"/>
          <circle cx="260" cy="11" r="3" fill="${t.main}"/>
          <circle cx="340" cy="11" r="3" fill="${t.gold}"/>
          <circle cx="420" cy="11" r="3" fill="${t.main}"/>
          <circle cx="500" cy="11" r="3" fill="${t.gold}"/>
          <circle cx="580" cy="11" r="3" fill="${t.main}"/>
          <circle cx="660" cy="11" r="3" fill="${t.gold}"/>
        </svg>
      `;
    }

    // Các món đồ & bông hoa bling bling đổi theo từng trang
    function buildItemStickerSVG(kind, t) {
      const idx = kind % 6;
      if (idx === 0) {
        // Bông hoa 6 cánh lấp lánh + nhũ vàng
        return `
          <svg viewBox="0 0 80 80">
            <g transform="translate(40,40)">
              <ellipse cx="0" cy="-16" rx="8" ry="13" fill="${t.main}"/>
              <ellipse cx="0" cy="-16" rx="8" ry="13" fill="${t.main}" transform="rotate(60)"/>
              <ellipse cx="0" cy="-16" rx="8" ry="13" fill="${t.main}" transform="rotate(120)"/>
              <ellipse cx="0" cy="-16" rx="8" ry="13" fill="${t.main}" transform="rotate(180)"/>
              <ellipse cx="0" cy="-16" rx="8" ry="13" fill="${t.main}" transform="rotate(240)"/>
              <ellipse cx="0" cy="-16" rx="8" ry="13" fill="${t.main}" transform="rotate(300)"/>
              <circle cx="0" cy="0" r="9.5" fill="${t.gold}" stroke="#ffffff" stroke-width="2.2"/>
              <circle cx="-2.5" cy="-2.5" r="2.5" fill="#ffffff"/>
            </g>
          </svg>
        `;
      }
      if (idx === 1) {
        // Nơ ruy băng bling bling
        return `
          <svg viewBox="0 0 80 80">
            <path d="M40 42 L16 24 L18 56 Z" fill="${t.main}" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
            <path d="M40 42 L64 24 L62 56 Z" fill="${t.main}" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
            <path d="M35 48 L24 68 L33 65 L39 71 Z" fill="${t.gold}"/>
            <path d="M45 48 L56 68 L47 65 L41 71 Z" fill="${t.gold}"/>
            <rect x="33" y="35" width="14" height="14" rx="5" fill="${t.gold}" stroke="#ffffff" stroke-width="2"/>
          </svg>
        `;
      }
      if (idx === 2) {
        // Vương miện đính đá quý lấp lánh
        return `
          <svg viewBox="0 0 80 80">
            <polygon points="14,56 18,26 32,40 40,20 48,40 62,26 66,56" fill="${t.gold}" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
            <rect x="14" y="55" width="52" height="8" rx="4" fill="${t.main}" stroke="#ffffff" stroke-width="1.8"/>
            <circle cx="40" cy="36" r="4.5" fill="${t.main}" stroke="#ffffff" stroke-width="1.5"/>
            <circle cx="24" cy="43" r="3" fill="#ffffff"/>
            <circle cx="56" cy="43" r="3" fill="#ffffff"/>
          </svg>
        `;
      }
      if (idx === 3) {
        // Máy ảnh kỷ niệm xinh xắn
        return `
          <svg viewBox="0 0 80 80">
            <rect x="26" y="18" width="16" height="8" rx="3" fill="${t.gold}" stroke="#ffffff" stroke-width="1.8"/>
            <rect x="14" y="25" width="52" height="36" rx="9" fill="${t.main}" stroke="#ffffff" stroke-width="2.2"/>
            <circle cx="42" cy="43" r="11" fill="#ffffff"/>
            <circle cx="42" cy="43" r="7" fill="${t.gold}"/>
            <circle cx="39" cy="40" r="2.4" fill="#ffffff"/>
            <circle cx="57" cy="33" r="3" fill="#fff394"/>
          </svg>
        `;
      }
      if (idx === 4) {
        // Viên kim cương / pha lê lấp lánh
        return `
          <svg viewBox="0 0 80 80">
            <polygon points="24,20 56,20 68,36 40,66 12,36" fill="${t.gold}" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
            <polygon points="24,20 56,20 48,36 32,36" fill="#fff7b2"/>
            <line x1="12" y1="36" x2="68" y2="36" stroke="#ffffff" stroke-width="1.8"/>
            <polyline points="32,36 40,66 48,36" fill="none" stroke="#ffffff" stroke-width="1.8"/>
          </svg>
        `;
      }
      // Bông hoa cúc / hướng dương rực rỡ
      return `
        <svg viewBox="0 0 80 80">
          <g transform="translate(40,40)">
            <circle cx="0" cy="-17" r="7" fill="${t.gold}"/>
            <circle cx="12" cy="-12" r="7" fill="${t.gold}"/>
            <circle cx="17" cy="0" r="7" fill="${t.gold}"/>
            <circle cx="12" cy="12" r="7" fill="${t.gold}"/>
            <circle cx="0" cy="17" r="7" fill="${t.gold}"/>
            <circle cx="-12" cy="12" r="7" fill="${t.gold}"/>
            <circle cx="-17" cy="0" r="7" fill="${t.gold}"/>
            <circle cx="-12" cy="-12" r="7" fill="${t.gold}"/>
            <circle cx="0" cy="0" r="10.5" fill="${t.main}" stroke="#ffffff" stroke-width="2.2"/>
            <circle cx="0" cy="0" r="4" fill="#fff7b2"/>
          </g>
        </svg>
      `;
    }

    function buildStarGemSVG(color) {
      return `
        <svg viewBox="0 0 28 28">
          <path d="M14 1 L17.2 10.8 L27 14 L17.2 17.2 L14 27 L10.8 17.2 L1 14 L10.8 10.8 Z"
                fill="${color}" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      `;
    }

    const pageNumbers = Object.keys(ALBUM_DATA).map(Number).sort((a, b) => a - b);
    const totalPages = pageNumbers.length;
    let currentIndex = 0;

    const coverScreen = document.getElementById("coverScreen");
    const albumScreen = document.getElementById("albumScreen");
    const motifBanner = document.getElementById("motifBanner");
    const titleInput = document.getElementById("titleInput");
    const jumpSelect = document.getElementById("jumpSelect");
    const mediaStage = document.getElementById("mediaStage");
    const pageCounter = document.getElementById("pageCounter");
    const progressFill = document.getElementById("progressFill");

    function encodeRelPath(relPath) {
      return "./" + relPath.split("/").map(encodeURIComponent).join("/");
    }

    function applyPageDecoration(pageNum) {
      const t = THEMES[(pageNum - 1) % THEMES.length];
      albumScreen.style.setProperty("--page-accent", t.accent);
      albumScreen.style.setProperty("--page-glow", t.glow);
      motifBanner.style.backgroundColor = t.bg;
      motifBanner.style.borderColor = t.border;
      motifBanner.innerHTML = buildBannerSVG(pageNum, t);
      return t;
    }

    function renderBlingDecor(pageNum, t) {
      const items = [
        { cls: "sticker-tl", kind: pageNum - 1 },
        { cls: "sticker-tr", kind: pageNum + 1 },
        { cls: "sticker-bl", kind: pageNum + 2 },
        { cls: "sticker-br", kind: pageNum + 3 }
      ];

      items.forEach(({ cls, kind }) => {
        const el = document.createElement("div");
        el.className = `bling-sticker ${cls}`;
        el.innerHTML = buildItemStickerSVG(kind, t);
        mediaStage.appendChild(el);
      });

      const gems = [
        { cls: "gem-1", col: t.gold },
        { cls: "gem-2", col: t.main },
        { cls: "gem-3", col: t.main },
        { cls: "gem-4", col: t.gold }
      ];

      gems.forEach(({ cls, col }) => {
        const star = document.createElement("div");
        star.className = `sparkle-gem ${cls}`;
        star.innerHTML = buildStarGemSVG(col);
        mediaStage.appendChild(star);
      });
    }

    function initJumpSelect() {
      jumpSelect.innerHTML = "";
      pageNumbers.forEach((n, i) => {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `Trang ${n}`;
        jumpSelect.appendChild(opt);
      });
    }

    function pauseCurrentVideo() {
      const vid = mediaStage.querySelector("video");
      if (vid) vid.pause();
    }

    function loadMedia(pageNum, item, candidates, pos, t) {
      if (pos >= candidates.length) {
        mediaStage.innerHTML = `
          <div class="missing-box">
            Chưa tìm thấy file cho Trang ${pageNum}
            <code>${item.image}</code>
          </div>
        `;
        renderBlingDecor(pageNum, t);
        return;
      }

      const rawPath = candidates[pos];
      const url = encodeRelPath(rawPath);
      const isVideo = /\.(mp4|webm|mov|m4v)$/i.test(rawPath);

      mediaStage.innerHTML = "";
      if (isVideo) {
        const video = document.createElement("video");
        video.src = url;
        video.controls = true;
        video.playsInline = true;
        video.loop = true;
        video.onerror = () => loadMedia(pageNum, item, candidates, pos + 1, t);
        mediaStage.appendChild(video);
      } else {
        const img = document.createElement("img");
        img.src = url;
        img.alt = item.title;
        img.onerror = () => loadMedia(pageNum, item, candidates, pos + 1, t);
        mediaStage.appendChild(img);
      }
      renderBlingDecor(pageNum, t);
    }

    function renderPage() {
      pauseCurrentVideo();
      const pageNum = pageNumbers[currentIndex];
      const item = ALBUM_DATA[pageNum];
      const t = applyPageDecoration(pageNum);
      titleInput.value = item.title;
      jumpSelect.value = currentIndex;
      pageCounter.textContent = `Trang ${pageNum} / ${totalPages}`;
      progressFill.style.width = `${(pageNum / totalPages) * 100}%`;
      loadMedia(pageNum, item, [item.image, `media/${item.image}`], 0, t);
    }

    function goPrev() {
      currentIndex = (currentIndex - 1 + totalPages) % totalPages;
      renderPage();
    }

    function goNext() {
      currentIndex = (currentIndex + 1) % totalPages;
      renderPage();
    }

    document.getElementById("openAlbumBtn").addEventListener("click", () => {
      coverScreen.style.display = "none";
      albumScreen.style.display = "block";
      currentIndex = 0;
      renderPage();
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      pauseCurrentVideo();
      albumScreen.style.display = "none";
      coverScreen.style.display = "block";
    });

    document.getElementById("prevBtn").addEventListener("click", goPrev);
    document.getElementById("nextBtn").addEventListener("click", goNext);

    jumpSelect.addEventListener("change", (e) => {
      currentIndex = Number(e.target.value);
      renderPage();
    });

    titleInput.addEventListener("input", (e) => {
      const pageNum = pageNumbers[currentIndex];
      ALBUM_DATA[pageNum].title = e.target.value;
    });

    document.addEventListener("keydown", (e) => {
      if (albumScreen.style.display !== "block" || document.activeElement === titleInput) return;
      if (e.key === "ArrowLeft") {
        goPrev();
      } else if (e.key === "ArrowRight") {
        goNext();
      }
    });

    let touchStartX = 0;
    mediaStage.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
      }
    }, { passive: true });

    mediaStage.addEventListener("touchend", (e) => {
      if (e.changedTouches.length === 1) {
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 55) {
          if (dx < 0) goNext();
          else goPrev();
        }
      }
    }, { passive: true });

    initJumpSelect();
  </script>
