<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Album Ảnh Đại Gia Đình 8D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      /* Nền caro / lưới nhỏ dịu mắt thay cho gradient chói */
      background-color: #161926;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    /* Trang bìa phong cách sổ tay có đường khâu viền */
    .cover-wrap {
      width: 100%;
      max-width: 430px;
      animation: fadeIn 0.25s ease;
    }

    .book-cover {
      width: 100%;
      min-height: 470px;
      background: #c8325d;
      /* Họa tiết chấm nhỏ đều trên bìa */
      background-image: radial-gradient(rgba(255, 248, 235, 0.14) 1.2px, transparent 1.2px);
      background-size: 16px 16px;
      border-radius: 22px;
      padding: 24px 22px 26px 46px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.55);
    }

    /* Đường chỉ khâu trang trí chạy quanh bìa */
    .book-cover::after {
      content: "";
      position: absolute;
      inset: 10px 10px 10px 36px;
      border: 2px dashed rgba(255, 236, 179, 0.55);
      border-radius: 16px;
      pointer-events: none;
    }

    /* Gáy sổ bên trái + lỗ ghim/khâu */
    .book-cover::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 26px;
      background: #352359;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 34px,
        rgba(255, 212, 84, 0.45) 34px,
        rgba(255, 212, 84, 0.45) 38px
      );
      border-top-left-radius: 22px;
      border-bottom-left-radius: 22px;
      z-index: 2;
    }

    .cover-badge {
      position: relative;
      z-index: 2;
      width: 100%;
      background: #fffaf0;
      border: 3px solid #ffc63b;
      border-radius: 18px;
      padding: 22px 16px;
      text-align: center;
      margin-top: 8px;
      box-shadow: 0 6px 0 rgba(75, 20, 42, 0.25);
    }

    /* Sticker góc nhỏ trên huy hiệu */
    .cover-badge::before {
      content: "8D";
      position: absolute;
      top: -11px;
      right: 14px;
      background: #ffbe2d;
      color: #3d1a2e;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 9px;
      border-radius: 999px;
      border: 2px solid #fffaf0;
    }

    .cover-badge h1 {
      color: #3c1d47;
      font-size: clamp(26px, 5.2vw, 32px);
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    .cover-badge p {
      color: #b63862;
      font-size: 14px;
      font-weight: 700;
      margin-top: 8px;
    }

    /* Khu vực khung trang trí ở giữa bìa (nhãn + khung viền nét đứt) */
    .cover-deco {
      position: relative;
      z-index: 2;
      width: 100%;
      background: rgba(255, 250, 240, 0.14);
      border: 1.5px dashed rgba(255, 248, 235, 0.55);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      color: #fff6e5;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
    }

    .open-btn {
      position: relative;
      z-index: 2;
      background: #ffbe2d;
      color: #3d1a2e;
      border: none;
      border-radius: 999px;
      padding: 13px 32px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #c7860a;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .open-btn:hover {
      background: #ffd147;
    }

    .open-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #c7860a;
    }

    /* Giao diện xem album bên trong */
    .album-box {
      display: none;
      width: min(880px, 96vw);
      background-color: #fffaf2;
      /* Họa tiết chấm bi kem nhẹ */
      background-image: radial-gradient(rgba(235, 75, 115, 0.11) 1.2px, transparent 1.2px);
      background-size: 20px 20px;
      color: #2d2a3a;
      border: 4px solid #eb4b73;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      animation: fadeIn 0.25s ease;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .back-btn {
      background: #b9323a;
      color: #ffffff;
      border: none;
      border-radius: 11px;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 0 #821d23;
    }

    .back-btn:hover {
      background: #cc3a43;
    }

    .back-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #821d23;
    }

    .title-box {
      flex: 1;
      min-width: 180px;
      background: #ffffff;
      border: 2px solid #eb4b73;
      border-radius: 12px;
      padding: 8px 14px;
      text-align: center;
      font-size: clamp(18px, 3.2vw, 23px);
      font-weight: 800;
      color: #2d2a3a;
      outline: none;
    }

    .title-box:focus {
      border-color: #c3305c;
      box-shadow: 0 0 0 3px rgba(235, 75, 115, 0.16);
    }

    .jump-select {
      background: #ffffff;
      color: #3d1a2e;
      border: 2px solid #ffc341;
      border-radius: 12px;
      padding: 9px 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      outline: none;
    }

    /* Khung ảnh kiểu trang sổ có viền chỉ mảnh bên trong */
    .media-stage {
      background: #ffffff;
      border: 2px solid #e6ddd0;
      border-radius: 16px;
      min-height: 330px;
      max-height: 64vh;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .media-stage::before {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1.5px dashed rgba(235, 75, 115, 0.28);
      border-radius: 12px;
      pointer-events: none;
    }

    .media-stage img,
    .media-stage video {
      position: relative;
      z-index: 1;
      max-width: 100%;
      max-height: 57vh;
      border-radius: 10px;
      object-fit: contain;
    }

    .missing-box {
      position: relative;
      z-index: 1;
      text-align: center;
      color: #5f6982;
      font-weight: 700;
      line-height: 1.55;
      padding: 16px;
    }

    .missing-box code {
      display: inline-block;
      margin-top: 8px;
      background: #fff3f6;
      border: 1px solid #f5c2d0;
      color: #b9323a;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      word-break: break-all;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: #efe3d5;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 14px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #eb4b73;
      border-radius: 999px;
      transition: width 0.2s ease;
    }

    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: #ffbe2d;
      color: #3d1a2e;
      border: none;
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 0 #c7860a;
    }

    .nav-btn:hover {
      background: #ffd147;
    }

    .nav-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #c7860a;
    }

    .page-badge {
      background: #eb4b73;
      color: #ffffff;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 800;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

      72: { image: "20261116_134443.jpg", title: "Oi vùi !" },
      73: { image: "20261116_134454.jpg", title: "Dẹt !" },
      74: { image: "20261116_134532.jpg", title: "Tổng bí thư Lê DUẨN !" },
      75: { image: "20261116_134545.jpg", title: "Toi ười !" },
      76: { image: "20261116_134555.jpg", title: "Ngậm mồm để anh làm việc !" },
      77: { image: "a3e3d61cf9aa4680b70cc682a1328aa3.webp", title: "ùi ui xúc xích ngon thế" },
      78: { image: "d83358fdf7db4f1d8ec3a7692e56f7c2.webp", title: "Sao lại ngon thế được nhở!" }
    };

    const pageNumbers = Object.keys(ALBUM_DATA).map(Number).sort((a, b) => a - b);
    const totalPages = pageNumbers.length;
    let currentIndex = 0;

    const coverScreen = document.getElementById("coverScreen");
    const albumScreen = document.getElementById("albumScreen");
    const titleInput = document.getElementById("titleInput");
    const jumpSelect = document.getElementById("jumpSelect");
    const mediaStage = document.getElementById("mediaStage");
    const pageCounter = document.getElementById("pageCounter");
    const progressFill = document.getElementById("progressFill");

    function encodeRelPath(relPath) {
      return "./" + relPath.split("/").map(encodeURIComponent).join("/");
    }

    function initJumpSelect() {
      jumpSelect.innerHTML = "";
      pageNumbers.forEach((n, i) => {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `Trang ${n}`;
        jumpSelect.appendChild(opt);
      });
    }

    function pauseCurrentVideo() {
      const vid = mediaStage.querySelector("video");
      if (vid) vid.pause();
    }

    function loadMedia(pageNum, item, candidates, pos) {
      if (pos >= candidates.length) {
        mediaStage.innerHTML = `
          <div class="missing-box">
            Chưa tìm thấy file cho Trang ${pageNum}
            <code>${item.image}</code>
          </div>
        `;
        return;
      }

      const rawPath = candidates[pos];
      const url = encodeRelPath(rawPath);
      const isVideo = /\.(mp4|webm|mov|m4v)$/i.test(rawPath);

      mediaStage.innerHTML = "";
      if (isVideo) {
        const video = document.createElement("video");
        video.src = url;
        video.controls = true;
        video.playsInline = true;
        video.loop = true;
        video.onerror = () => loadMedia(pageNum, item, candidates, pos + 1);
        mediaStage.appendChild(video);
      } else {
        const img = document.createElement("img");
        img.src = url;
        img.alt = item.title;
        img.onerror = () => loadMedia(pageNum, item, candidates, pos + 1);
        mediaStage.appendChild(img);
      }
    }

    function renderPage() {
      pauseCurrentVideo();
      const pageNum = pageNumbers[currentIndex];
      const item = ALBUM_DATA[pageNum];
      titleInput.value = item.title;
      jumpSelect.value = currentIndex;
      pageCounter.textContent = `Trang ${pageNum} / ${totalPages}`;
      progressFill.style.width = `${(pageNum / totalPages) * 100}%`;
      loadMedia(pageNum, item, [item.image, `media/${item.image}`], 0);
    }

    function goPrev() {
      currentIndex = (currentIndex - 1 + totalPages) % totalPages;
      renderPage();
    }

    function goNext() {
      currentIndex = (currentIndex + 1) % totalPages;
      renderPage();
    }

    document.getElementById("openAlbumBtn").addEventListener("click", () => {
      coverScreen.style.display = "none";
      albumScreen.style.display = "block";
      currentIndex = 0;
      renderPage();
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      pauseCurrentVideo();
      albumScreen.style.display = "none";
      coverScreen.style.display = "block";
    });

    document.getElementById("prevBtn").addEventListener("click", goPrev);
    document.getElementById("nextBtn").addEventListener("click", goNext);

    jumpSelect.addEventListener("change", (e) => {
      currentIndex = Number(e.target.value);
      renderPage();
    });

    titleInput.addEventListener("input", (e) => {
      const pageNum = pageNumbers[currentIndex];
      ALBUM_DATA[pageNum].title = e.target.value;
    });

    document.addEventListener("keydown", (e) => {
      if (albumScreen.style.display !== "block" || document.activeElement === titleInput) return;
      if (e.key === "ArrowLeft") {
        goPrev();
      } else if (e.key === "ArrowRight") {
        goNext();
      }
    });

    let touchStartX = 0;
    mediaStage.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
      }
    }, { passive: true });

    mediaStage.addEventListener("touchend", (e) => {
      if (e.changedTouches.length === 1) {
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 55) {
          if (dx < 0) goNext();
          else goPrev();
        }
      }
    }, { passive: true });

    initJumpSelect();
  </script>
</body>
</html>
