<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Album Ảnh Đại Gia Đình 8D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 15%, rgba(235, 75, 115, 0.22), transparent 42%),
        radial-gradient(circle at 85% 85%, rgba(255, 190, 45, 0.16), transparent 45%),
        linear-gradient(160deg, #141624 0%, #1d2036 55%, #151726 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    /* Trang bìa */
    .cover-wrap {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.35s ease;
    }

    .book-cover {
      width: 100%;
      min-height: 470px;
      background: linear-gradient(155deg, #d63867 0%, #b52652 100%);
      border-radius: 24px;
      padding: 28px 24px 28px 48px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow:
        0 22px 45px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .book-cover:hover {
      transform: translateY(-4px);
      box-shadow:
        0 26px 52px rgba(0, 0, 0, 0.62),
        0 0 28px rgba(235, 75, 115, 0.28);
    }

    .book-cover::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 28px;
      background: linear-gradient(180deg, #432f70 0%, #2b1d4a 100%);
      border-top-left-radius: 24px;
      border-bottom-left-radius: 24px;
      box-shadow: inset -2px 0 6px rgba(0, 0, 0, 0.35);
    }

    .book-cover::after {
      content: "✦ 8D ✦";
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%) rotate(-90deg);
      width: 28px;
      color: rgba(255, 224, 130, 0.8);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      white-space: nowrap;
      pointer-events: none;
    }

    .cover-badge {
      width: 100%;
      background: linear-gradient(180deg, #fffdf7 0%, #fff4df 100%);
      border: 3px solid #ffc341;
      border-radius: 18px;
      padding: 24px 16px;
      text-align: center;
      margin-top: 8px;
      box-shadow: 0 8px 20px rgba(65, 30, 50, 0.22);
    }

    .cover-badge h1 {
      color: #3d1e48;
      font-size: clamp(26px, 5.2vw, 33px);
      font-weight: 900;
      letter-spacing: 1.5px;
      line-height: 1.15;
    }

    .cover-badge p {
      color: #b93b65;
      font-size: clamp(13px, 3.1vw, 15px);
      font-weight: 700;
      margin-top: 10px;
    }

    .open-btn {
      background: linear-gradient(180deg, #ffd047 0%, #ffb41c 100%);
      color: #3d1a2e;
      border: none;
      border-radius: 999px;
      padding: 14px 34px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 6px 0 #c98608, 0 12px 24px rgba(0, 0, 0, 0.3);
      transition: transform 0.14s ease, filter 0.15s ease;
    }

    .open-btn:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .open-btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #c98608;
    }

    /* Khung album bên trong */
    .album-box {
      display: none;
      width: min(880px, 96vw);
      background:
        radial-gradient(rgba(235, 75, 115, 0.08) 1px, transparent 1px),
        #fffaf2;
      background-size: 18px 18px;
      color: #2d2a3a;
      border: 4px solid #eb4b73;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.55);
      animation: fadeIn 0.25s ease;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .back-btn {
      background: linear-gradient(180deg, #cb3a43 0%, #a82830 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 3px 0 #7c1b21;
      transition: transform 0.12s ease, filter 0.15s ease;
    }

    .back-btn:hover {
      filter: brightness(1.06);
    }

    .back-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #7c1b21;
    }

    .title-box {
      flex: 1;
      background: #ffffff;
      border: 2px solid #eb4b73;
      border-radius: 14px;
      padding: 9px 14px;
      text-align: center;
      font-size: clamp(18px, 3.5vw, 24px);
      font-weight: 800;
      color: #2d2a3a;
      outline: none;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .title-box:focus {
      border-color: #c3305c;
      box-shadow: 0 0 0 4px rgba(235, 75, 115, 0.18);
    }

    .media-stage {
      background: #ffffff;
      border: 2px solid #eadfd2;
      border-radius: 16px;
      min-height: 330px;
      max-height: 64vh;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 2px 8px rgba(45, 42, 58, 0.04);
    }

    .media-stage img,
    .media-stage video {
      max-width: 100%;
      max-height: 58vh;
      border-radius: 12px;
      object-fit: contain;
      box-shadow: 0 8px 22px rgba(24, 26, 40, 0.14);
      animation: popIn 0.22s ease;
    }

    .missing-box {
      text-align: center;
      color: #5f6982;
      font-weight: 700;
      line-height: 1.55;
      padding: 16px;
    }

    .missing-box code {
      display: inline-block;
      margin-top: 8px;
      background: #fff0f4;
      border: 1px solid #f7c5d3;
      color: #b9323a;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      word-break: break-all;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: #f2e4d8;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 14px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #eb4b73 0%, #ffbe2d 100%);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
    }

    .nav-btn {
      background: linear-gradient(180deg, #ffd047 0%, #ffb41c 100%);
      color: #3d1a2e;
      border: none;
      border-radius: 999px;
      padding: 10px 22px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 0 #c98608;
      transition: transform 0.12s ease, filter 0.15s ease;
    }

    .nav-btn:hover {
      filter: brightness(1.05);
    }

    .nav-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #c98608;
    }

    .page-badge {
      background: linear-gradient(180deg, #f2547c 0%, #d83b63 100%);
      color: #ffffff;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 3px 10px rgba(216, 59, 99, 0.28);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      from { opacity: 0.2; transform: scale(0.985); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 560px) {
      .album-box {
        padding: 14px;
      }
      .bottom-bar {
        flex-wrap: wrap;
        justify-content: center;
      }
      .nav-btn {
        padding: 9px 18px;
        font-size: 14px;
      }
    }
  </style>
</head>

    };

    const pageNumbers = Object.keys(ALBUM_DATA).map(Number).sort((a, b) => a - b);
    const totalPages = pageNumbers.length;
    let currentIndex = 0;

    const coverScreen = document.getElementById("coverScreen");
    const albumScreen = document.getElementById("albumScreen");
    const titleInput = document.getElementById("titleInput");
    const mediaStage = document.getElementById("mediaStage");
    const pageCounter = document.getElementById("pageCounter");
    const progressFill = document.getElementById("progressFill");

    function pauseCurrentVideo() {
      const vid = mediaStage.querySelector("video");
      if (vid) vid.pause();
    }

    function buildCandidates(filename) {
      return [filename, `media/${filename}`];
    }

    function encodeRelPath(relPath) {
      return "./" + relPath.split("/").map(encodeURIComponent).join("/");
    }

    function updateProgress(pageNum) {
      progressFill.style.width = `${(pageNum / totalPages) * 100}%`;
    }

    function loadMedia(pageNum, item, candidates, pos) {
      if (pos >= candidates.length) {
        mediaStage.innerHTML = `
          <div class="missing-box">
            Chưa tìm thấy file cho Trang ${pageNum}
            <code>${item.image}</code>
          </div>
        `;
        return;
      }

      const rawPath = candidates[pos];
      const url = encodeRelPath(rawPath);
      const isVideo = /\.(mp4|webm|mov|m4v)$/i.test(rawPath);

      mediaStage.innerHTML = "";

      if (isVideo) {
        const video = document.createElement("video");
        video.src = url;
        video.controls = true;
        video.playsInline = true;
        video.loop = true;
        video.onerror = () => loadMedia(pageNum, item, candidates, pos + 1);
        mediaStage.appendChild(video);
      } else {
        const img = document.createElement("img");
        img.src = url;
        img.alt = item.title;
        img.onerror = () => loadMedia(pageNum, item, candidates, pos + 1);
        mediaStage.appendChild(img);
      }
    }

    function renderPage() {
      pauseCurrentVideo();
      const pageNum = pageNumbers[currentIndex];
      const item = ALBUM_DATA[pageNum];
      titleInput.value = item.title;
      pageCounter.textContent = `Trang ${pageNum} / ${totalPages}`;
      updateProgress(pageNum);
      loadMedia(pageNum, item, buildCandidates(item.image), 0);
    }

    function goPrev() {
      currentIndex = (currentIndex - 1 + totalPages) % totalPages;
      renderPage();
    }

    function goNext() {
      currentIndex = (currentIndex + 1) % totalPages;
      renderPage();
    }

    document.getElementById("openAlbumBtn").addEventListener("click", () => {
      coverScreen.style.display = "none";
      albumScreen.style.display = "block";
      currentIndex = 0;
      renderPage();
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      pauseCurrentVideo();
      albumScreen.style.display = "none";
      coverScreen.style.display = "flex";
    });

    document.getElementById("prevBtn").addEventListener("click", goPrev);
    document.getElementById("nextBtn").addEventListener("click", goNext);

    titleInput.addEventListener("input", (event) => {
      const pageNum = pageNumbers[currentIndex];
      ALBUM_DATA[pageNum].title = event.target.value;
    });

    document.addEventListener("keydown", (event) => {
      if (albumScreen.style.display !== "block" || document.activeElement === titleInput) {
        return;
      }
      if (event.key === "ArrowLeft") {
        goPrev();
      } else if (event.key === "ArrowRight") {
        goNext();
      }
    });

    // Vuốt ngang chuyển trang trên điện thoại
    let touchStartX = 0;
    mediaStage.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
      }
    }, { passive: true });

    mediaStage.addEventListener("touchend", (e) => {
      if (e.changedTouches.length === 1) {
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 55) {
          if (dx < 0) goNext();
          else goPrev();
        }
      }
    }, { passive: true });
  </script>
</body>
</html>
